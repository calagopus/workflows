name: Determine tags
description: Determine the image tags to push

inputs:
  image-tag:
    description: Primary image tag (e.g. nightly, next, or a release version)
    required: true
  tag-variant:
    description: The tag variant suffix (e.g. aio), empty for the main image
    required: false
    default: ""
  stable-tag:
    description: The stable tag this variant falls under (e.g. latest, aio)
    required: true
  tag-latest:
    description: Also move the stable tag ("true"/"false")
    required: false
    default: "false"
  tag-latest-pre:
    description: Also move the pre-release tag ("true"/"false")
    required: false
    default: "false"
  ghcr-image:
    description: Image name as pushed to the GitHub Container Registry.
    required: true
  dockerhub-image:
    description: Image name as pushed to Docker Hub.
    required: true

runs:
  using: composite
  steps:
    - name: Determine tags
      id: tags
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        TAG_VARIANT: ${{ inputs.tag-variant }}
        STABLE_TAG: ${{ inputs.stable-tag }}
        TAG_LATEST: ${{ inputs.tag-latest }}
        TAG_LATEST_PRE: ${{ inputs.tag-latest-pre }}
        GHCR_IMAGE: ${{ inputs.ghcr-image }}
        DOCKERHUB_IMAGE: ${{ inputs.dockerhub-image }}
      run: |
        SUFFIXES=("${IMAGE_TAG}${TAG_VARIANT:+-$TAG_VARIANT}")
        [[ "$TAG_LATEST_PRE" == "true" ]] && SUFFIXES+=("${STABLE_TAG}-pre")
        [[ "$TAG_LATEST" == "true" ]] && SUFFIXES+=("$STABLE_TAG")

        IMAGE_TAGS=""
        for t in "${SUFFIXES[@]}"; do
          # IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_TAGS:+,}${GHCR_IMAGE}:${t},${DOCKERHUB_IMAGE}:${t}"
          IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_TAGS:+,}${GHCR_IMAGE}:${t}"
        done
        echo "image-tags=$IMAGE_TAGS" >> "$GITHUB_OUTPUT"

outputs:
  image-tags:
    description: Generated comma-separated image tags
    value: ${{ steps.tags.outputs.image-tags }}
