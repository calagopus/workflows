name: Build multi-arch image
description: Build (and optionally push) a multi-arch image

inputs:
  dockerfile:
    description: Path to the Dockerfile to build
    required: true
  image-tags:
    description: Comma-separated image tags
    required: true
  push-image:
    description: Whether or not the image is pushed to the registry ("true"/"false")
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build multi-arch image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le
        push: ${{ inputs.push-image }}
        tags: ${{ inputs.image-tags }}
        sbom: true
        provenance: true

outputs:
  digest:
    description: Digest of the built image index
    value: ${{ steps.build.outputs.digest }}
