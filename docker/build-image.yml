name: Build multi-arch image
description: Build multi-arch image

inputs:
  dockerfile:
    description: dockerfile to upload
    required: true
    type: string
  image-tags:
    description: The tags generated by the determine tags step
    required: true
    type: string
  push-image:
    description: Wether or not the image is pushed to the registry
    required: false
    default: false
    type: boolean

runs:
  using: composite
  steps:
    - name: Build multi-arch image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le
        push: ${{ inputs.push-image }}
        tags: ${{ inputs.image-tags }}
        sbom: true
        provenance: true

outputs:
  digests:
    description: The digests from all the images
    value: ${{ steps.build.outputs.digest }}
