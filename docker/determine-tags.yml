name: Determine tags
description: Determine tags

inputs:
  image-tag:
    description: The tags generated by the determine tags step
    required: true
    type: string
  tag-variant:
    description: The tag variant (like main, aio)
    required: true
    type: string
  stable-tag:
    description: The stable tag it falls under
    required: true
    type: string
  tag-latest:
    description: The tags generated by the determine tags step
    required: false
    type: boolean
  tag-latest-pre:
    description: The tags generated by the determine tags step
    required: false
    type: boolean
  ghcr-image:
    description: Image name as pushed to the Github Container Registry.
    required: true
  dockerhub-image:
    description: Image name as pushed to the Docker image registry.
    required: true

runs:
  using: composite
  steps:
    - name: Determine tags
      id: tags
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        TAG_VARIANT: ${{ inputs.tag-variant }}
        STABLE_TAG: ${{ inputs.stable-tag }}
        TAG_LATEST: ${{ inputs.tag-latest }}
        TAG_LATEST_PRE: ${{ inputs.tag-latest-pre }}
        GHCR_IMAGE: ${{ inputs.ghcr-image }}
        DOCKERHUB_IMAGE: ${{ inputs.dockerhub-image }}
      run: |
        SUFFIXES=("${IMAGE_TAG}${TAG_VARIANT:+-$TAG_VARIANT}")
        [[ "$TAG_LATEST_PRE" == "true" ]] && SUFFIXES+=("${STABLE_TAG}-pre")
        [[ "$TAG_LATEST" == "true" ]] && SUFFIXES+=("$STABLE_TAG")

        IMAGE_TAGS=""
        for t in "${SUFFIXES[@]}"; do
          # IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_TAGS:+,}${GHCR_IMAGE}:${t},${DOCKERHUB_IMAGE}:${t}"
          IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_TAGS:+,}${GHCR_IMAGE}:${t}"
        done
        echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT

outputs:
  image-tags:
    description: Generated image-tags
    value: ${{ steps.tags.outputs.IMAGE_TAGS }}
