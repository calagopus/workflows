name: Build docker images

on:
  workflow_call:
    inputs:
        image-tag:
          description: Primary image tag (e.g. nightly, next, or a release version)
          required: true
          type: string
        tag-latest:
          description: Also move the stable tags (latest, aio, heavy, heavy-aio)
          required: false
          type: boolean
          default: false
        tag-latest-pre:
          description: Also move the pre-release tags (latest-pre, aio-pre, ...)
          required: false
          type: boolean
          default: false
        binary-name:
          required: true
          description: The name of the panel binary
          type: string
          default: panel-rs
        aio-binary-name:
          required: true
          description: The name of the aio panel binary
          type: string
          default: panel-rs-aio

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  create-image:
    runs-on: ubuntu-24.04
    name: Create multi-arch ${{ matrix.variant }} Docker image
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            dockerfile: Dockerfile
            tag_variant: ""
            stable_tag: latest
          - variant: aio
            dockerfile: Dockerfile.aio
            tag_variant: aio
            stable_tag: aio
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PROJECT_NAME }}

      - name: Download source SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-source.cyclonedx.json
          path: sbom

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.binary-name }}-*-linux
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare binaries
        env:
          BIN_NAME: ${{ inputs.binary-name }}
          AIO_BIN_NAME: ${{ inputs.aio-binary-name }}
        run: |
          for pair in x86_64:amd64 aarch64:arm64 riscv64:riscv64 ppc64le:ppc64le; do
            build="${pair%%:*}-linux"
            arch="${pair#*:}"
            mkdir -p ".docker/$arch"
            for bin in "$BIN_NAME" "$AIO_BIN_NAME"; do
              cp "dist/$bin-$build/$bin-$build" ".docker/$arch/$bin"
            done
          done

          chmod +x .docker/*/*

      - name: Determine tags
        id: determine-tags
        uses: calagopus/workflows/docker/determine-tags@87d6290dfeb3b976128700bad400422c82f0503f
        with:
          image-tag: ${{ inputs.image-tag }}
          tag-variant: ${{ matrix.tag-variant }}
          stable-tag: ${{ matrix.stable-tag }}
          tag-latest: ${{ inputs.tag-latest }}
          tag-latest-pre: ${{ inputs.tag-latest-pre }}

      - name: Build multi-arch image
        uses: calagopus/workflows/docker/build-image@87d6290dfeb3b976128700bad400422c82f0503f
        with:
          dockerfile: ./docker/${{ matrix.dockerfile }}
          image-tags: ${{ steps.determine-tags.outputs.image-tags }}

      - name: Login to container registries
        uses: calagopus/workflows/docker/registry-login@87d6290dfeb3b976128700bad400422c82f0503f

      - name: Push multi-arch image
        id: push-image
        uses: calagopus/workflows/docker/build-image@87d6290dfeb3b976128700bad400422c82f0503f
        with:
          dockerfile: ./docker/${{ matrix.dockerfile }}
          image-tags: ${{ steps.determine-tags.outputs.image-tags }}
          push-image: true

      - name: Attach SBOM
        uses: calagopus/workflows/docker/attach-sbom@87d6290dfeb3b976128700bad400422c82f0503f
        with:
          ghcr-image: ${{ env.GHCR_IMAGE }}
          dockerhub-image: ${{ env.DOCKERHUB_IMAGE }}
          digest: ${{ steps.push-image.outputs.digest }}

      - name: Run cosign
        uses: calagopus/workflows/cosign@87d6290dfeb3b976128700bad400422c82f0503f
        with:
          ghcr-image: ${{ env.GHCR_IMAGE }}
          dockerhub-image: ${{ env.DOCKERHUB_IMAGE }}
          digest: ${{ steps.push-image.outputs.digest }}
