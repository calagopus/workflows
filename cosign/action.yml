name: Run cosign
description: Cryptographically sign Docker images pushed to GHCR and Docker Hub.

inputs:
  ghcr-image:
    description: Image name as pushed to the GitHub Container Registry.
    required: true
  dockerhub-image:
    description: Image name as pushed to Docker Hub.
    required: true
  digest:
    description: Digest of the pushed image.
    required: true

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image with cosign
      shell: bash
      env:
        GHCR_IMAGE: ${{ inputs.ghcr-image }}
        DOCKERHUB_IMAGE: ${{ inputs.dockerhub-image }}
        DIGEST: ${{ inputs.digest }}
      run: |
        cosign sign --yes --recursive "${GHCR_IMAGE}@${DIGEST}"
        cosign sign --yes --recursive "${DOCKERHUB_IMAGE}@${DIGEST}"
